<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcador Google Live - 100% Realtime</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background-color: #202124;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .marcador-responsive {
            width: 100vw;
            height: 100vh;
            padding: 4vh 5vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .liga-header {
            font-size: 4vh;
            color: #9aa0a6;
            font-weight: 400;
            text-align: left;
            margin-bottom: 2vh;
        }

        .partido-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-grow: 1;
            width: 100%;
        }

        .equipo-bloque {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 28%;
            text-align: center;
        }

        .escudo {
            width: auto;
            height: 35vh;
            max-width: 100%;
            object-fit: contain;
            margin-bottom: 3vh;
        }

        .nombre-equipo {
            font-size: 5vh;
            font-weight: 500;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .goles {
            font-size: 22vh;
            font-weight: 400;
            color: #ffffff;
            width: 15%;
            text-align: center;
            line-height: 1;
        }

        .tiempo-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 14%;
        }

        .minuto {
            font-size: 7vh;
            font-weight: 700;
            color: #81c995;
            letter-spacing: 0.1vw;
            text-align: center;
        }

        .live-bar {
            width: 4vw;
            height: 0.8vh;
            background-color: #81c995;
            margin-top: 1.5vh;
            border-radius: 4px;
        }

        /* Estado cuando el partido no ha empezado o terminó */
        .status-bar {
            font-size: 3vh;
            color: #9aa0a6;
            margin-top: 1vh;
        }
    </style>
</head>

<body>

    <div class="marcador-responsive">
        <div class="liga-header" id="competicion">Cargando partido...</div>

        <div class="partido-box">

            <div class="equipo-bloque">
                <img class="escudo" id="logo-local" src="" alt="">
                <div class="nombre-equipo" id="nombre-local">--</div>
            </div>

            <div class="goles" id="goles-local">-</div>

            <div class="tiempo-box">
                <div class="minuto" id="tiempo-partido">--:--</div>
                <div class="live-bar" id="barra-vivo" style="display:none;"></div>
                <div class="status-bar" id="estado-partido"></div>
            </div>

            <div class="goles" id="goles-visitante">-</div>

            <div class="equipo-bloque">
                <img class="escudo" id="logo-visitante" src="" alt="">
                <div class="nombre-equipo" id="nombre-visitante">--</div>
            </div>

        </div>
    </div>

    <script>
        // ================= CONFIGURACIÓN DE TU API =================
        const API_KEY = "692ff3dbfba2a4ddb2f7945f8f050ee5"; // <-- Pega aquí tu llave de API-Sports
        const PARTIDO_ID = "1505456";       // <-- Pega aquí el ID del partido de Champions del día
        // ===========================================================

        async function obtenerMarcadorEnVivo() {
            const url = `https://v3.football.api-sports.io/fixtures?id=${PARTIDO_ID}`;

            try {
                const respuesta = await fetch(url, {
                    "method": "GET",
                    "headers": {
                        "x-rapidapi-host": "v3.football.api-sports.io",
                        "x-rapidapi-key": API_KEY
                    }
                });

                const datos = await respuesta.json();

                if (datos.response && datos.response.length > 0) {
                    const partido = datos.response[0];

                    // 1. Nombre de la Liga
                    document.getElementById('competicion').innerText = `${partido.league.name} - ${partido.league.round}`;

                    // 2. Datos Local
                    document.getElementById('nombre-local').innerText = partido.teams.home.name;
                    document.getElementById('logo-local').src = partido.teams.home.logo;
                    document.getElementById('goles-local').innerText = partido.goals.home !== null ? partido.goals.home : 0;

                    // 3. Datos Visitante
                    document.getElementById('nombre-visitante').innerText = partido.teams.away.name;
                    document.getElementById('logo-visitante').src = partido.teams.away.logo;
                    document.getElementById('goles-visitante').innerText = partido.goals.away !== null ? partido.goals.away : 0;

                    // 4. Tiempo y Estado del partido
                    const estado = partido.fixture.status.short; // FT (Terminado), 1H, 2H (En vivo), NS (No empezado)
                    const tiempoActual = partido.fixture.status.elapsed; // Minuto actual

                    const tiempoElemento = document.getElementById('tiempo-partido');
                    const barraVivo = document.getElementById('barra-vivo');
                    const estadoTexto = document.getElementById('estado-partido');

                    if (estado === "NS") {
                        tiempoElemento.innerText = "00:00";
                        estadoTexto.innerText = "Por empezar";
                        barraVivo.style.display = "none";
                    } else if (estado === "1H" || estado === "2H" || estado === "HT") {
                        tiempoElemento.innerText = estado === "HT" ? "F.T. (MT)" : `${tiempoActual}'`;
                        estadoTexto.innerText = estado === "HT" ? "Medio Tiempo" : "EN VIVO";
                        tiempoElemento.style.color = "#81c995"; // Verde Google
                        barraVivo.style.display = "block";
                    } else if (estado === "FT") {
                        tiempoElemento.innerText = "Fin";
                        estadoTexto.innerText = "Partido Terminado";
                        tiempoElemento.style.color = "#ffffff";
                        barraVivo.style.display = "none";
                    } else {
                        tiempoElemento.innerText = "--:--";
                        barraVivo.style.display = "none";
                    }

                } else {
                    console.error("No se encontraron datos para el partido ID:", PARTIDO_ID);
                }

            } catch (error) {
                console.error("Error al conectar con la API de fútbol:", error);
            }
        }

        // Ejecutar inmediatamente al abrir la pantalla
        obtenerMarcadorEnVivo();

        // Actualizar automáticamente cada 60 segundos (60000 ms) para no agotar el plan gratis
        setInterval(obtenerMarcadorEnVivo, 60000);
    </script>
</body>

</html>
