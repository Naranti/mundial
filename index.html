<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcador Mundial Naranti México</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .marcador-responsive {
            width: 100vw;
            height: 100vh;
            padding: 4vh 5vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .liga-header {
            font-size: 15vh;
            color: #ffffff;
            font-weight: 700; /* <-- Cambiado a 700 para ponerlo en NEGRITA */
            text-align: center; /* <-- Opcional: centrado queda mejor con tamaños grandes */
            margin-bottom: 2vh;
        }

        .partido-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-grow: 1;
            width: 100%;
        }

        .equipo-bloque {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 28%;
            text-align: center;
        }

        .escudo {
            width: min(40vh, 100%);
            height: min(40vh, 100%);
            object-fit: contain;
            margin-bottom: 3vh;
            filter: drop-shadow(0 0 1.2vh white);
        }

        .nombre-equipo {
            font-size: 20vh;
            font-weight: 500;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .goles {
            font-size: 40vh;
            font-weight: 400;
            color: #ffffff;
            width: 15%;
            text-align: center;
            line-height: 1;
        }

        .tiempo-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 14%;
        }

        .minuto {
            font-size: 10vh;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.1vw;
            text-align: center;
        }

        .live-bar {
            width: 4vw;
            height: 0.8vh;
            background-color: #134225;
            margin-top: 1.5vh;
            border-radius: 4px;
        }

        /* Estado cuando el partido no ha empezado o terminó */
        .status-bar {
            font-size: 3vh;
            color: #ffffff;
            margin-top: 1vh;
            align-items: center;
            justify-content: center;
        }

        /* ==================== ANIMACIÓN DE GOL ==================== */

        /* Capa de fondo que cubre toda la pantalla */
        .gol-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at center, rgba(0,80,40,0.92) 0%, rgba(0,40,20,0.97) 100%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        /* Clase que activa la visibilidad del overlay */
        .gol-overlay.visible {
            opacity: 1;
        }

        /* Texto principal ¡GOOOOL! */
        .gol-titulo {
            font-size: 22vh;
            font-weight: 900;
            color: #ffffff;
            text-align: center;
            text-shadow:
                0 0 4vh rgba(255,255,255,0.6),
                0 0 8vh rgba(255,220,0,0.5);
            animation: gol-pulso 0.6s ease-in-out infinite alternate;
            line-height: 1;
        }

        /* Texto secundario con el nombre del equipo */
        .gol-equipo {
            font-size: 8vh;
            font-weight: 600;
            color: #ffd700;
            text-align: center;
            margin-top: 2vh;
            text-shadow: 0 0 3vh rgba(255,215,0,0.7);
        }

        /* Contenedor de los balones animados */
        .gol-balones {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 10000;
        }

        /* Cada balón individual */
        .balon {
            position: absolute;
            bottom: -15vh;
            font-size: 8vh;
            animation: balon-saltar 1.2s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
            opacity: 0;
        }

        /* Animación de pulso del texto GOOOOL */
        @keyframes gol-pulso {
            from { transform: scale(1);   }
            to   { transform: scale(1.06); }
        }

        /* Animación de cada balón saltando */
        @keyframes balon-saltar {
            0%   { bottom: -15vh; opacity: 0; transform: rotate(0deg)   scale(0.5); }
            20%  { opacity: 1; }
            60%  { bottom: 70vh;  opacity: 1; transform: rotate(540deg) scale(1.1); }
            80%  { bottom: 55vh;  opacity: 1; transform: rotate(720deg) scale(0.95); }
            100% { bottom: 65vh;  opacity: 0; transform: rotate(900deg) scale(1); }
        }
        /* =========================================================== */
    </style>
</head>

<body>

    <!-- ==================== OVERLAY DE CELEBRACIÓN DE GOL ==================== -->
    <!-- Este elemento se activa dinámicamente cuando se detecta un gol -->
    <div class="gol-overlay" id="gol-overlay">
        <div class="gol-titulo">¡GOOOOL!</div>
        <div class="gol-equipo" id="gol-nombre-equipo">de ...</div>
    </div>
    <!-- Contenedor de balones animados (se rellena por JS) -->
    <div class="gol-balones" id="gol-balones"></div>
    <!-- =========================================================================== -->

    <div class="marcador-responsive">
        <div class="liga-header" id="competicion">Titulo marcador..</div>

        <div class="partido-box">

            <div class="equipo-bloque">
                <img class="escudo" id="logo-local" src="" alt="">
                <div class="nombre-equipo" id="nombre-local">--</div>
            </div>

            <div class="goles" id="goles-local">-</div>

            <div class="tiempo-box">
                <div class="minuto" id="tiempo-partido">--:--</div>
                <div class="live-bar" id="barra-vivo" style="display:none;"></div>
                <div class="status-bar" id="estado-partido"></div>
            </div>

            <div class="goles" id="goles-visitante">-</div>

            <div class="equipo-bloque">
                <img class="escudo" id="logo-visitante" src="" alt="">
                <div class="nombre-equipo" id="nombre-visitante">--</div>
            </div>

        </div>
    </div>

    <script>
        // ================= CONFIGURACIÓN DE TU API =================
        const API_KEY = "692ff3dbfba2a4ddb2f7945f8f050ee5"; // Tu llave de API-Sports
        const PARTIDO_ID = "1539010";                       // ID del partido que quieres monitorear
        
        const INTERVALO_PREVIO_PARTIDO = 300000;     // 5 minutos antes de iniciar
        const INTERVALO_EN_VIVO = 30000;             // 90 segundos en vivo
        const INTERVALO_FINALIZADO = 3600000;        // 1 hora finalizado
                      // 10 minutos finalizado
        let intervaloActual = INTERVALO_PREVIO_PARTIDO;
        // ===========================================================

        // ================= VARIABLES PARA DETECCIÓN DE GOLES =================
        // Guardan el marcador de la última actualización para comparar cambios
        let golesLocalAnterior     = null;
        let golesVisitanteAnterior = null;
        let marcadorInicializado   = false; // Evita la animación en la primera carga
        let animacionActiva        = false; // Evita que dos animaciones se pisen
        // ======================================================================

        function traducirTextoBase(texto) {
            if (!texto) return "";

            return texto
                .replace(/World Cup/gi, "Copa del Mundo")
                .replace(/UEFA/gi, "UEFA")
                .replace(/FIFA/gi, "FIFA")
                .replace(/CONCACAF/gi, "CONCACAF")
                .replace(/CONMEBOL/gi, "CONMEBOL")
                .replace(/International Friendlies?/gi, "Amistosos internacionales")
                .replace(/Friendlies?/gi, "Amistosos")
                .replace(/Nations League/gi, "Liga de Naciones")
                .replace(/Champions League/gi, "Liga de Campeones")
                .replace(/Europa League/gi, "Liga Europa")
                .replace(/Conference League/gi, "Liga Conferencia")
                .replace(/Super Cup/gi, "Supercopa")
                .replace(/Cup/gi, "Copa")
                .replace(/League/gi, "Liga")
                .replace(/Qualification|Qualifiers?/gi, "Clasificación")
                .replace(/Women/gi, "Femenil")
                .replace(/Men/gi, "Varonil")
                .replace(/Group Stage/gi, "Fase de grupos")
                .replace(/Group\s+([A-Z])/gi, "Grupo $1")
                .replace(/1st Half/gi, "Primer tiempo")
                .replace(/2nd Half/gi, "Segundo tiempo")
                .replace(/Round of 16/gi, "Octavos de final")
                .replace(/Round\s*(\d+)/gi, "Ronda $1")
                .replace(/Quarter-finals|Quarterfinals/gi, "Cuartos de final")
                .replace(/Semi-finals|Semifinals/gi, "Semifinales")
                .replace(/Grand Final/gi, "Gran final")
                .replace(/Third place|3rd Place/gi, "Tercer lugar")
                .replace(/Final/gi, "Final")
                .replace(/Play-offs|Playoffs/gi, "Eliminatoria")
                .replace(/Relegation/gi, "Descenso")
                .replace(/Apertura/gi, "Apertura")
                .replace(/Clausura/gi, "Clausura")
                .replace(/Matchday/gi, "Jornada")
                .replace(/Regular Season/gi, "Temporada regular")
                .replace(/Stage\s*(\d+)/gi, "Etapa $1")
                .replace(/Knockout Stage/gi, "Fase eliminatoria")
                .replace(/Preliminary Round/gi, "Ronda preliminar")
                .replace(/\s*-\s*/g, " - ")
                .replace(/\s{2,}/g, " ")
                .trim();
        }

        function traducirCompeticion(nombreLiga, ronda) {
            const ligaTraducida = traducirTextoBase(nombreLiga);
            const rondaTraducida = traducirTextoBase(ronda);

            if (!ligaTraducida && !rondaTraducida) return "";
            if (!rondaTraducida) return ligaTraducida;
            if (!ligaTraducida) return rondaTraducida;
            if (ligaTraducida.toLowerCase() === rondaTraducida.toLowerCase()) return ligaTraducida;

            return `${ligaTraducida} - ${rondaTraducida}`;
        }

        // ================= FUNCIÓN: LANZAR ANIMACIÓN DE GOL =================
        /**
         * Muestra el overlay de gol con el nombre del equipo que anotó
         * y anima varios balones de fútbol saltando en pantalla.
         * @param {string} nombreEquipo - Nombre del equipo que anotó
         */
        function lanzarAnimacionGol(nombreEquipo) {
            if (animacionActiva) return; // No interrumpir si ya hay una animación en curso
            animacionActiva = true;

            // Actualizar texto del equipo que anotó
            const overlay   = document.getElementById('gol-overlay');
            const contenedor = document.getElementById('gol-balones');
            document.getElementById('gol-nombre-equipo').innerText = `de ${nombreEquipo}`;

            // Mostrar el overlay con fade-in
            overlay.classList.add('visible');

            // Limpiar balones anteriores
            contenedor.innerHTML = '';

            // Crear varios balones en posiciones y tiempos distintos
            const totalBalones = 12;
            for (let i = 0; i < totalBalones; i++) {
                const balon = document.createElement('span');
                balon.classList.add('balon');
                balon.textContent = '⚽';

                // Posición horizontal aleatoria
                balon.style.left = `${5 + Math.random() * 88}vw`;

                // Tamaño ligeramente variado
                balon.style.fontSize = `${6 + Math.random() * 5}vh`;

                // Retraso escalonado para que no salgan todos a la vez
                balon.style.animationDelay = `${i * 0.18}s`;

                // Duración ligeramente variable para naturalidad
                balon.style.animationDuration = `${1.0 + Math.random() * 0.5}s`;

                contenedor.appendChild(balon);
            }

            // Ocultar overlay y limpiar balones después de 4.5 segundos
            setTimeout(() => {
                overlay.classList.remove('visible');
                setTimeout(() => {
                    contenedor.innerHTML = '';
                    animacionActiva = false;
                }, 350); // Esperar el fade-out antes de limpiar
            }, 4500);
        }
        // ======================================================================

        // ================= FUNCIÓN: DETECTAR GOL =================
        /**
         * Compara el marcador actual con el anterior y dispara la animación
         * si algún equipo aumentó sus goles.
         * @param {number} golesLocalActual     - Goles actuales del local
         * @param {number} golesVisitanteActual - Goles actuales del visitante
         * @param {string} nombreLocal          - Nombre del equipo local
         * @param {string} nombreVisitante      - Nombre del equipo visitante
         */
        function detectarGol(golesLocalActual, golesVisitanteActual, nombreLocal, nombreVisitante) {
            // No disparar si los goles vienen como null
            if (golesLocalActual === null || golesVisitanteActual === null) return;

            // Primera carga: solo guardar el marcador actual sin animar
            if (!marcadorInicializado) {
                golesLocalAnterior     = golesLocalActual;
                golesVisitanteAnterior = golesVisitanteActual;
                marcadorInicializado   = true;
                return;
            }

            // Comparar goles del equipo local
            if (golesLocalActual > golesLocalAnterior) {
                lanzarAnimacionGol(nombreLocal);
            }

            // Comparar goles del equipo visitante
            if (golesVisitanteActual > golesVisitanteAnterior) {
                lanzarAnimacionGol(nombreVisitante);
            }

            // Actualizar marcador anterior
            golesLocalAnterior     = golesLocalActual;
            golesVisitanteAnterior = golesVisitanteActual;
        }
        // =========================================================

        async function obtenerMarcadorEnVivo() {
            // CORRECCIÓN: Eliminamos el "GET " y cambiamos "live=all" por "id=PARTIDO_ID"
            const url = `https://v3.football.api-sports.io/fixtures?id=${PARTIDO_ID}`;

            try {
                const respuesta = await fetch(url, {
                    "method": "GET",
                    "headers": {
                        "x-rapidapi-host": "v3.football.api-sports.io",
                        "x-rapidapi-key": API_KEY
                    }
                });

                const datos = await respuesta.json();

                if (datos.response && datos.response.length > 0) {
                    const partido = datos.response[0];

                    // 1. Nombre de la Liga / Competición
                    document.getElementById('competicion').innerText = traducirCompeticion(partido.league.name, partido.league.round);

                    // 2. Datos Local
                    const nombreLocal = partido.teams.home.name;
                    document.getElementById('nombre-local').innerText = nombreLocal;
                    document.getElementById('logo-local').src = partido.teams.home.logo;
                    const estado = partido.fixture.status.short;
                    if (estado === "NS" || estado === "TBD") {
                        intervaloActual = INTERVALO_PREVIO_PARTIDO;
                    } else if (
                        estado === "1H" ||
                        estado === "2H" ||
                        estado === "HT" ||
                        estado === "ET" ||
                        estado === "BT" ||
                        estado === "P" ||
                        estado === "SUSP" ||
                        estado === "INT"
                    ) {
                        intervaloActual = INTERVALO_EN_VIVO;
                    } else if (
                        estado === "FT" ||
                        estado === "AET" ||
                        estado === "PEN"
                    ) {
                        intervaloActual = INTERVALO_FINALIZADO;
                    } else {
                        intervaloActual = INTERVALO_PREVIO_PARTIDO;
                    }

                    const partidoConMarcador = [
                        "1H",
                        "2H",
                        "HT",
                        "ET",
                        "BT",
                        "P",
                        "SUSP",
                        "INT",
                        "FT",
                        "AET",
                        "PEN"
                    ].includes(estado);

                    // 3. Datos Visitante
                    const nombreVisitante = partido.teams.away.name;
                    document.getElementById('nombre-visitante').innerText = nombreVisitante;
                    document.getElementById('logo-visitante').src = partido.teams.away.logo;
                    if (partidoConMarcador) {
                        const golesLocalMostrar = partido.goals.home !== null ? partido.goals.home : 0;
                        const golesVisitanteMostrar = partido.goals.away !== null ? partido.goals.away : 0;

                        document.getElementById('goles-local').innerText = golesLocalMostrar;
                        document.getElementById('goles-visitante').innerText = golesVisitanteMostrar;

                        // 4-bis. Detectar si hubo gol comparando con el marcador anterior
                        detectarGol(golesLocalMostrar, golesVisitanteMostrar, nombreLocal, nombreVisitante);
                    } else {
                        document.getElementById('goles-local').innerText = "-";
                        document.getElementById('goles-visitante').innerText = "-";

                        marcadorInicializado = false;
                        golesLocalAnterior = null;
                        golesVisitanteAnterior = null;
                    }

                    // 5. Tiempo y Estado del partido
                    const tiempoActual = partido.fixture.status.elapsed; // Minuto actual

                    const tiempoElemento = document.getElementById('tiempo-partido');
                    const barraVivo = document.getElementById('barra-vivo');
                    const estadoTexto = document.getElementById('estado-partido');

                    // Lógica de estados de API-Football
                    if (estado === "NS") { 
                        // No Empezado (Not Started)
                        tiempoElemento.innerText = "00:00";
                        estadoTexto.innerText = "Por empezar";
                        tiempoElemento.style.color = "#ffffff";
                        barraVivo.style.display = "none";
                    } else if (estado === "1H" || estado === "2H" || estado === "HT") {
                        // En vivo (Primera mitad, Segunda mitad o Entretiempo)
                        tiempoElemento.innerText = estado === "HT" ? "MT" : `${tiempoActual}'`;
                        estadoTexto.innerText = estado === "HT" ? "Medio Tiempo" : "EN VIVO";
                        tiempoElemento.style.color = "#ffffff";
                        barraVivo.style.display = "block";
                    } else if (estado === "FT") {
                        // Finalizado (Full Time)
                        tiempoElemento.innerText = "Fin";
                        estadoTexto.innerText = "Partido Terminado";
                        tiempoElemento.style.color = "#ffffff";
                        barraVivo.style.display = "none";
                    } else {
                        // Otros estados (Cancelado, Suspendido, Penales, etc.)
                        tiempoElemento.innerText = "--:--";
                        estadoTexto.innerText = partido.fixture.status.long;
                        barraVivo.style.display = "none";
                    }

                } else {
                    console.warn("No se encontraron datos para el partido ID:", PARTIDO_ID);
                    document.getElementById('competicion').innerText = "Partido no encontrado o ID incorrecto";
                }

            } catch (error) {
                console.error("Error al conectar con la API de fútbol:", error);
                document.getElementById('competicion').innerText = "Error de conexión";
            }
        }

        async function iniciarActualizacionDinamica() {
            await obtenerMarcadorEnVivo();
            setTimeout(iniciarActualizacionDinamica, intervaloActual);
        }

        iniciarActualizacionDinamica();
    </script>
</body>

</html>
